# Cloud deployment of the daily Nifty 50 + SENSEX report runner.
#
# Usage (on the cloud server, in the repo root):
#   docker compose -f scripts/daily_report/docker-compose.yml up -d
#
# The container stays up as a thin "cron gate": it runs the daily report at
# 08:00 (server local time — the target box is on Asia/Kolkata, so that is
# 08:00 IST, pre-open, capturing the full previous trading session) on every
# day that is NOT a public holiday-ish no-op. The gate itself does not know
# about market closures; it runs daily and the run is cheap when data is
# unchanged. To stop the schedule at 2027-01-01, the container exits by
# itself when the date passes the DAILY_REPORT_UNTIL env var.
#
# Reports land in the named volume at /home/appuser/.tradingagents/reports/daily/
# On the host that volume is at:
#   $(docker volume inspect tradingagents_daily_reports --format '{{.Mountpoint}}')
#   -> /var/lib/docker/volumes/tradingagents_daily_reports/_data/.tradingagents/reports/

services:
  daily-report:
    build: ..
    image: tradingagents-daily:local
    container_name: tradingagents-daily-report
    # Replace the interactive CLI entrypoint with the daily-fire gate.
    # The Dockerfile copies the whole repo to /home/appuser/app and sets it as
    # WORKDIR, so the module path `scripts.daily_report.cron_gate` resolves
    # from there.
    entrypoint: ["/bin/sh", "-c",
      "cd /home/appuser/app && exec python -m scripts.daily_report.cron_gate"]
    env_file:
      - ../.env
    environment:
      - TRADINGAGENTS_IN_DOCKER=1
      - TRADINGAGENTS_RESULTS_DIR=/home/appuser/.tradingagents/logs
      # The gate's stop date: it will run every day until this date (inclusive),
      # then exit so the container stops rescheduling itself.
      - DAILY_REPORT_UNTIL=${DAILY_REPORT_UNTIL:-2027-01-01}
      # The hour (24h, server-local time) the report fires. Default 08:00 IST.
      - DAILY_REPORT_HOUR=${DAILY_REPORT_HOUR:-8}
      # 1 = the container waits for the first run immediately on startup;
      # 0 = only fire on the schedule. Default 1 so a manual `up -d` today
      # still produces today's report.
      - DAILY_REPORT_RUN_ON_STARTUP=${DAILY_REPORT_RUN_ON_STARTUP:-1}
    volumes:
      - daily_reports:/home/appuser/.tradingagents
    restart: unless-stopped

volumes:
  daily_reports:
