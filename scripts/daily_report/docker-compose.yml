# Cloud deployment of the daily Nifty 50 + SENSEX report runner.
#
# Usage (on the cloud server, in the repo root):
#   docker compose -f scripts/daily_report/docker-compose.yml up -d
#
# The container stays up as a thin "cron gate" with ONE scheduled fire per
# TRADING DAY (Mon-Fri minus declared NSE/BSE exchange holidays), at
# DAILY_REPORT_HOUR (default 02:00 IST, after the previous session closed at
# 15:30 IST). Each fire runs the report sweep, then CHAINS the digest
# summarizer immediately once the sweep completes - the digest is not a
# separately scheduled job, so it always summarizes a just-finished day.
# Exchange holidays are maintained in
# /home/appuser/.tradingagents/exchange_holidays.json (on the named volume,
# no rebuild to add a date); a fire landing on a declared holiday is skipped
# and re-scheduled to the next trading day. To stop the schedule at
# 2027-01-01 the container exits by itself when the date passes the stop
# date. The gate process runs as the unprivileged appuser (uid 1000), never
# root.
#
# Runtime configuration (per user directive 2026-10-24: "moving the reports
# folder must be a configuration change, not a rebuild+deploy"):
#   There is no database in this project, so these knobs live in the repo's
#   .env file (already mounted here via env_file). Edit the DAILY_REPORT_*
#   keys in .env to change reports_dir / hour / until / run_on_startup /
#   analysts — the change takes effect at the next fire (a fresh process is
#   spawned each time), with NO image rebuild and NO container recreation.
#   See scripts/daily_report/config.py for the full key list.
#
# Retention: the runner deletes previous days' report folders at the start of
# each run (no archive is kept), so the reports root holds at most today's
# reports.

services:
  daily-report:
    build: ../..
    image: tradingagents-daily:local
    container_name: tradingagents-daily-report
    # Replace the interactive CLI entrypoint with the daily-fire gate.
    # The Dockerfile copies the whole repo to /home/appuser/app and sets it as
    # WORKDIR, so the module path `scripts.daily_report.cron_gate` resolves
    # from there.
    entrypoint: ["/bin/sh", "-c",
      "cd /home/appuser/app && exec python -m scripts.daily_report.cron_gate"]
    env_file:
      - ../../.env
    environment:
      - TRADINGAGENTS_IN_DOCKER=1
      - TRADINGAGENTS_RESULTS_DIR=/home/appuser/.tradingagents/logs
      # The DAILY_REPORT_* keys are set in .env (per the design above); the
      # built-in defaults in scripts/daily_report/config.py apply when a key
      # is absent. Note the container runs as uid 1000 (appuser), so a
      # DAILY_REPORTS_DIR value must be a path that uid 1000 can write —
      # inside the mounted /home/appuser/.tradingagents tree, or a bind
      # mount of a host dir with matching ownership.
    volumes:
      - daily_reports:/home/appuser/.tradingagents
      # Reports folder on the host (per user request 2026-10-24: reports live
      # at /root/user/reports, read directly on the box without a volume
      # lookup). The host source is /root/user/reports; it is bound at a path
      # the unprivileged appuser (uid 1000) can actually reach inside the
      # container — /home/appuser/reports — because the container's /root is
      # root-owned and not traversable by uid 1000. DAILY_REPORTS_DIR in
      # .env is set to the container path /home/appuser/reports; the host path
      # /root/user/reports is what the operator reads on the box.
      - /root/user/reports:/home/appuser/reports
    restart: unless-stopped

volumes:
  daily_reports:
